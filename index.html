<!DOCTYPE html>
<html dir="rtl">
<head>
    <title>تحويل النص إلى صوت</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .controls {
            margin-top: 20px;
        }
        select, input {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>تحويل النص إلى صوت</h1>
    
    <textarea id="textInput" placeholder="أدخل النص هنا..."></textarea>
    
    <div>
        <button onclick="speak()">تحدث</button>
        <button onclick="stop()">إيقاف</button>
        <button onclick="pause()">إيقاف مؤقت</button>
        <button onclick="resume()">استئناف</button>
    </div>
    
    <div class="controls">
        <label>السرعة: </label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        
        <label>النبرة: </label>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
        
        <label>اللغة: </label>
        <select id="language">
            <option value="ar-SA">العربية</option>
            <option value="en-US">English</option>
            <option value="fr-FR">Français</option>
        </select>
    </div>

    <script>
        let currentUtterance = null;
        
        function speak() {
            const text = document.getElementById('textInput').value;
            if (!text) {
                alert('الرجاء إدخال النص');
                return;
            }
            
            // إيقاف أي كلام قيد التشغيل
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            
            // تطبيق الإعدادات
            utterance.rate = parseFloat(document.getElementById('rate').value);
            utterance.pitch = parseFloat(document.getElementById('pitch').value);
            utterance.lang = document.getElementById('language').value;
            
            currentUtterance = utterance;
            
            utterance.onend = () => {
                console.log('انتهى النطق');
                currentUtterance = null;
            };
            
            window.speechSynthesis.speak(utterance);
        }
        
        function stop() {
            window.speechSynthesis.cancel();
            currentUtterance = null;
        }
        
        function pause() {
            window.speechSynthesis.pause();
        }
        
        function resume() {
            window.speechSynthesis.resume();
        }
        
        // تحميل الأصوات المتاحة
        window.speechSynthesis.onvoiceschanged = () => {
            const voices = window.speechSynthesis.getVoices();
            console.log('الأصوات المتاحة:', voices);
        };
    </script>
</body>
</html>
